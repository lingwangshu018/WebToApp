name: Apply Android runtime selector patch

on:
  push:
    branches:
      - feat/android-edge-mode

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-selector]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-edge-mode
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/apply_runtime_selector_patch.py
      - name: Install test dependencies
        run: python -m pip install -r server/requirements.txt pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_android_runtime_modes.py tests/test_apk_edge_mode.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.v5.js js/i18n.strings.js server/engine/distiller.py server/engine/apk_builder.py tests/test_android_runtime_modes.py
          git commit -m "feat: add selectable TWA immersive runtime [runtime-selector]"
          git push origin HEAD:feat/android-edge-mode
