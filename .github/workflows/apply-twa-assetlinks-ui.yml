name: Apply TWA assetlinks download UI

on:
  push:
    branches:
      - feat/android-edge-mode

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[twa-assetlinks-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-edge-mode
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/apply_twa_assetlinks_ui.py
      - name: Install test dependencies
        run: python -m pip install -r server/requirements.txt pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_twa_assetlinks_download.py tests/test_twa_builder.py tests/test_android_runtime_modes.py tests/test_apk_edge_mode.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/main.py server/engine/distiller.py docs/DEPLOY.zh.md tests/test_twa_assetlinks_download.py
          git commit -m "feat: expose TWA assetlinks verification file [twa-assetlinks-ui]"
          git push origin HEAD:feat/android-edge-mode
