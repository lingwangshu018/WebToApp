name: TWA workflow smoke check

on:
  pull_request:
    paths:
      - '.github/workflows/twa-test-build.yml'
      - 'tests/test_twa_test_workflow.py'
  push:
    branches:
      - feat/manual-twa-test-build

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_twa_test_workflow.py
